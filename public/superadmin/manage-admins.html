<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Admins — CabGo Super Admin</title>
  <meta name="description" content="Super Admin administrator management: provision accounts, edit permissions, toggle account access, or delete admin profiles." />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="app-layout">
  <div class="main-content">
    <div class="page-content">

      <div class="card">
        <div class="card-header">
          <div>
            <h3 class="card-title">System Administrators Directory</h3>
            <p class="card-subtitle">Manage administrative accounts and privileges</p>
          </div>
          <button class="btn btn-primary" onclick="openCreateAdminModal()">+ Create New Admin</button>
        </div>

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Admin Profile</th>
                <th>Mobile</th>
                <th>Assigned Permissions</th>
                <th>Status</th>
                <th>Created Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admins-tbody">
              <tr><td colspan="6" style="text-align:center;padding:var(--space-6)">Loading administrator accounts...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Create Admin Modal -->
<div id="create-admin-modal" class="modal-overlay" style="display:none">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title">Provision New Administrator</h3>
      <button class="modal-close" onclick="UI.closeModal('create-admin-modal')">×</button>
    </div>
    <form id="create-admin-form" onsubmit="event.preventDefault(); submitCreateAdmin();">
      <div class="modal-body">
        <div class="form-group mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="create-name" class="form-control" placeholder="e.g. Ramesh Kumar" required />
        </div>
        <div class="form-group mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="create-email" class="form-control" placeholder="admin@cabsystem.com" required />
        </div>
        <div class="form-group mb-3">
          <label class="form-label">Temporary Password</label>
          <input type="password" id="create-pass" class="form-control" placeholder="Strong password" required minlength="6" />
        </div>
        <div class="form-group mb-4">
          <label class="form-label">Mobile Number</label>
          <input type="tel" id="create-mobile" class="form-control" placeholder="9876543210" required />
        </div>

        <label class="form-label mb-2">Initial Permissions Granted</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);background:var(--glass);padding:var(--space-3);border-radius:var(--radius-md)">
          <label class="flex items-center gap-2"><input type="checkbox" name="perm" value="MANAGE_DRIVERS" checked /> Drivers Approval</label>
          <label class="flex items-center gap-2"><input type="checkbox" name="perm" value="MANAGE_PASSENGERS" checked /> Passengers</label>
          <label class="flex items-center gap-2"><input type="checkbox" name="perm" value="MANAGE_VEHICLES" checked /> Fleet Vehicles</label>
          <label class="flex items-center gap-2"><input type="checkbox" name="perm" value="MANAGE_FARES" checked /> Pricing / Fares</label>
          <label class="flex items-center gap-2"><input type="checkbox" name="perm" value="VIEW_REPORTS" checked /> Financial Reports</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="UI.closeModal('create-admin-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="create-admin-btn">Create Account</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Admin Modal -->
<div id="edit-admin-modal" class="modal-overlay" style="display:none">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title">Update Administrator Account</h3>
      <button class="modal-close" onclick="UI.closeModal('edit-admin-modal')">×</button>
    </div>
    <form id="edit-admin-form" onsubmit="event.preventDefault(); submitEditAdmin();">
      <div class="modal-body">
        <input type="hidden" id="edit-admin-id" />
        <div class="form-group mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="edit-name" class="form-control" required />
        </div>
        <div class="form-group mb-3">
          <label class="form-label">Mobile Number</label>
          <input type="tel" id="edit-mobile" class="form-control" required />
        </div>
        <div class="form-group mb-3">
          <label class="form-label">Account Status</label>
          <select id="edit-status" class="form-control">
            <option value="active">Active</option>
            <option value="blocked">Blocked / Suspended</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="UI.closeModal('edit-admin-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-edit-btn">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  Auth.requireRole('superadmin');
  buildSidebar('superadmin', 'Manage Admins');
  UI.populateSidebarUser();

  let adminList = [];

  async function loadAdmins() {
    const res = await API.get('/api/superadmin/admins');
    if (!res.success) {
      UI.error(res.message || 'Failed to fetch admin accounts');
      return;
    }
    adminList = res.data || [];
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('admins-tbody');
    if (!adminList.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:var(--space-6);color:var(--text-muted)">No secondary admins created yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = adminList.map(a => `
      <tr>
        <td>
          <div class="flex items-center gap-3">
            <div class="avatar" style="width:36px;height:36px;font-size:0.9rem">${(a.name || 'A')[0].toUpperCase()}</div>
            <div>
              <strong style="color:var(--text-primary)">${a.name}</strong>
              <div style="font-size:0.8rem;color:var(--text-muted)">${a.email}</div>
            </div>
          </div>
        </td>
        <td>${a.mobile}</td>
        <td>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${(a.permissions || []).map(p => `<span class="badge badge-purple" style="font-size:0.7rem">${p}</span>`).join('') || '<span style="color:var(--text-muted);font-size:0.8rem">None</span>'}
          </div>
        </td>
        <td>${UI.badge(a.status)}</td>
        <td>${UI.formatDate(a.created_at)}</td>
        <td>
          <div class="flex gap-2">
            <button class="btn btn-secondary btn-sm" onclick="openEditModal(${a.user_id})">✏️ Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteAdminAccount(${a.user_id})">🗑️ Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function openCreateAdminModal() {
    document.getElementById('create-admin-form').reset();
    UI.openModal('create-admin-modal');
  }

  async function submitCreateAdmin() {
    const perms = Array.from(document.querySelectorAll('input[name="perm"]:checked')).map(el => el.value);
    const btn = document.getElementById('create-admin-btn');
    UI.setLoading(btn, true, 'Creating...');

    const res = await API.post('/api/superadmin/admins', {
      name: document.getElementById('create-name').value.trim(),
      email: document.getElementById('create-email').value.trim(),
      password: document.getElementById('create-pass').value,
      mobile: document.getElementById('create-mobile').value.trim(),
      permissions: perms
    });

    UI.setLoading(btn, false, 'Create Account');

    if (res.success) {
      UI.success('Administrator provisioned successfully!');
      UI.closeModal('create-admin-modal');
      loadAdmins();
    } else {
      UI.error(res.message || 'Failed to create admin');
    }
  }

  function openEditModal(id) {
    const admin = adminList.find(a => a.user_id === id);
    if (!admin) return;

    document.getElementById('edit-admin-id').value = admin.user_id;
    document.getElementById('edit-name').value = admin.name;
    document.getElementById('edit-mobile').value = admin.mobile;
    document.getElementById('edit-status').value = admin.status;

    UI.openModal('edit-admin-modal');
  }

  async function submitEditAdmin() {
    const id = document.getElementById('edit-admin-id').value;
    const btn = document.getElementById('save-edit-btn');
    UI.setLoading(btn, true, 'Saving...');

    const res = await API.put(`/api/superadmin/admins/${id}`, {
      name: document.getElementById('edit-name').value.trim(),
      mobile: document.getElementById('edit-mobile').value.trim(),
      status: document.getElementById('edit-status').value
    });

    UI.setLoading(btn, false, 'Save Changes');

    if (res.success) {
      UI.success('Admin updated successfully!');
      UI.closeModal('edit-admin-modal');
      loadAdmins();
    } else {
      UI.error(res.message || 'Update failed');
    }
  }

  async function deleteAdminAccount(id) {
    if (!confirm('Are you sure you want to delete this administrator account? This cannot be undone.')) return;

    const res = await API.delete(`/api/superadmin/admins/${id}`);
    if (res.success) {
      UI.success('Administrator deleted');
      loadAdmins();
    } else {
      UI.error(res.message || 'Delete failed');
    }
  }

  loadAdmins();
</script>
</body>
</html>
