<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Trips — CabGo Admin</title>
  <link rel="stylesheet" href="/css/global.css" /><link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="app-layout">
  <div class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div><h1>🗺️ Manage Trips</h1><p>Monitor all active and completed trips</p></div>
      </div>

      <!-- Status Tabs -->
      <div class="tabs" id="status-tabs">
        <button class="tab-btn active" onclick="filterByStatus('')" data-status="">All</button>
        <button class="tab-btn" onclick="filterByStatus('started')" data-status="started">🟢 Active</button>
        <button class="tab-btn" onclick="filterByStatus('completed')" data-status="completed">✅ Completed</button>
        <button class="tab-btn" onclick="filterByStatus('assigned')" data-status="assigned">📌 Assigned</button>
        <button class="tab-btn" onclick="filterByStatus('cancelled')" data-status="cancelled">❌ Cancelled</button>
      </div>

      <div class="table-wrapper">
        <div id="trips-table">
          <div class="empty-state"><div class="spinner spinner-lg"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script><script src="/js/auth.js"></script>
<script src="/js/ui.js"></script><script src="/js/sidebar.js"></script>
<script>
  Auth.requireRole('admin','superadmin');
  buildSidebar(Auth.getUser().role, 'Manage Trips');
  UI.populateSidebarUser();

  let currentStatus = '';

  function filterByStatus(status) {
    currentStatus = status;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.status === status));
    loadTrips();
  }

  async function loadTrips() {
    const res = await API.get('/api/admin/trips', { status: currentStatus });
    const trips = res.data?.trips || [];

    document.getElementById('trips-table').innerHTML = trips.length ? `
      <table><thead><tr>
        <th>#</th><th>Passenger</th><th>Driver</th><th>Route</th>
        <th>Vehicle</th><th>Started</th><th>Fare</th><th>Payment</th><th>Status</th>
      </tr></thead><tbody>
      ${trips.map(t => `<tr>
        <td><strong>#${t.trip_id}</strong></td>
        <td>${t.passenger_name}</td>
        <td>${t.driver_name}</td>
        <td>
          <div style="font-size:0.8rem"><strong>${(t.pickup_location||'').substring(0,20)}</strong></div>
          <div style="font-size:0.75rem;color:var(--text-muted)">→ ${(t.destination||'').substring(0,20)}</div>
        </td>
        <td>${t.vehicle_number}<br><small>${t.model}</small></td>
        <td style="font-size:0.8rem">${UI.formatDate(t.start_time)}</td>
        <td><strong>${UI.rupee(t.fare||t.estimated_fare)}</strong></td>
        <td>${t.payment_status ? UI.badge(t.payment_status) : '—'}</td>
        <td>${UI.badge(t.trip_status)}</td>
      </tr>`).join('')}
      </tbody></table>`
    : UI.empty('🗺️','No trips found','No trips match the selected filter.');
  }

  loadTrips();
</script>
</body>
</html>
