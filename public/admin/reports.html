<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports & Analytics — CabGo Admin</title>
  <meta name="description" content="Detailed business analytics, trip volumes, revenue trends, and operational metrics." />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <style>
    .chart-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      margin-bottom: var(--space-6);
    }
    .bar-chart-bars {
      display: flex;
      align-items: flex-end;
      gap: var(--space-3);
      height: 180px;
      padding-top: var(--space-4);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .bar-col {
      flex: 1;
      min-width: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }
    .bar-fill {
      width: 100%;
      max-width: 32px;
      background: var(--grad-primary);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .bar-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: var(--space-2);
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div class="app-layout">
  <div class="main-content">
    <div class="page-content">

      <!-- Date Filters & Export -->
      <div class="card mb-6">
        <div class="card-header">
          <div>
            <h3 class="card-title">Business Analytics & Revenue Reports</h3>
            <p class="card-subtitle">Performance tracking and financial metrics</p>
          </div>
          <form id="filter-form" onsubmit="event.preventDefault(); loadReport();" class="flex gap-3 items-center">
            <div class="form-group mb-0">
              <input type="date" id="date-from" class="form-control" />
            </div>
            <span style="color:var(--text-muted)">to</span>
            <div class="form-group mb-0">
              <input type="date" id="date-to" class="form-control" />
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Filter</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="clearFilters()">Reset</button>
          </form>
        </div>

        <!-- KPI Cards -->
        <div class="stats-grid mb-6">
          <div class="stat-card">
            <div class="stat-icon green">💰</div>
            <div class="stat-content">
              <div class="stat-label">Total Revenue</div>
              <div class="stat-value" id="kpi-rev">₹0</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue">🚖</div>
            <div class="stat-content">
              <div class="stat-label">Completed Rides</div>
              <div class="stat-value" id="kpi-trips">0</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">📊</div>
            <div class="stat-content">
              <div class="stat-label">Average Fare / Ride</div>
              <div class="stat-value" id="kpi-avg">₹0</div>
            </div>
          </div>
        </div>

        <!-- Visual Bar Chart -->
        <div class="chart-container">
          <h4 style="font-size:1rem;margin-bottom:var(--space-2)">Daily Revenue Breakdown</h4>
          <div class="bar-chart-bars" id="bar-chart-wrapper">
            <!-- Bars rendered via JS -->
          </div>
        </div>

        <!-- Breakdown Table -->
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Trips Executed</th>
                <th>Daily Total Fare</th>
                <th>Avg / Trip</th>
              </tr>
            </thead>
            <tbody id="daily-report-tbody">
              <tr><td colspan="4" style="text-align:center;padding:var(--space-6)">Loading report data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  Auth.requireRole('admin', 'superadmin');
  const role = Auth.getUser()?.role || 'admin';
  buildSidebar(role, 'Reports');
  UI.populateSidebarUser();

  async function loadReport() {
    const from = document.getElementById('date-from').value;
    const to = document.getElementById('date-to').value;

    let url = '/api/admin/reports/revenue';
    if (from && to) url += `?from=${from}&to=${to}`;

    const res = await API.get(url);
    if (!res.success) {
      UI.error(res.message || 'Failed to fetch report');
      return;
    }

    const { totals, daily } = res.data;
    document.getElementById('kpi-rev').textContent = UI.rupee(totals?.total_revenue || 0);
    document.getElementById('kpi-trips').textContent = totals?.total_trips || 0;
    document.getElementById('kpi-avg').textContent = UI.rupee(totals?.avg_fare || 0);

    renderChart(daily || []);
    renderTable(daily || []);
  }

  function renderChart(daily) {
    const wrapper = document.getElementById('bar-chart-wrapper');
    if (!daily.length) {
      wrapper.innerHTML = `<div style="margin:auto;color:var(--text-muted);font-size:0.85rem">No revenue activity recorded in this period.</div>`;
      return;
    }

    const maxRev = Math.max(...daily.map(d => parseFloat(d.revenue) || 1), 100);

    wrapper.innerHTML = daily.slice().reverse().map(d => {
      const rev = parseFloat(d.revenue) || 0;
      const pct = Math.max((rev / maxRev) * 100, 8);
      const dateStr = d.date ? d.date.split('T')[0].slice(5) : '';
      return `
        <div class="bar-col" title="${d.date}: ${UI.rupee(rev)} (${d.trips} trips)">
          <div class="bar-fill" style="height:${pct}%;"></div>
          <div class="bar-label">${dateStr}</div>
        </div>
      `;
    }).join('');
  }

  function renderTable(daily) {
    const tbody = document.getElementById('daily-report-tbody');
    if (!daily.length) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:var(--space-6);color:var(--text-muted)">No records for selected dates.</td></tr>`;
      return;
    }

    tbody.innerHTML = daily.map(d => {
      const rev = parseFloat(d.revenue) || 0;
      const trips = parseInt(d.trips) || 0;
      const avg = trips ? (rev / trips) : 0;
      return `
        <tr>
          <td><strong>${d.date ? d.date.split('T')[0] : '—'}</strong></td>
          <td>${trips} rides</td>
          <td style="font-weight:700;color:var(--accent)">${UI.rupee(rev)}</td>
          <td>${UI.rupee(avg)}</td>
        </tr>
      `;
    }).join('');
  }

  function clearFilters() {
    document.getElementById('date-from').value = '';
    document.getElementById('date-to').value = '';
    loadReport();
  }

  loadReport();
</script>
</body>
</html>
