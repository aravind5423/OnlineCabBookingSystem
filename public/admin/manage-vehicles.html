<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Vehicles — CabGo Admin</title>
  <meta name="description" content="Fleet management: monitor registered vehicles, driver associations, and operational statuses." />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="app-layout">
  <div class="main-content">
    <div class="page-content">

      <!-- Header actions -->
      <div class="card mb-6">
        <div class="card-header">
          <div>
            <h3 class="card-title">Fleet & Vehicle Management</h3>
            <p class="card-subtitle">All vehicles registered under verified driver profiles</p>
          </div>
          <div class="flex gap-3">
            <select id="type-filter" class="form-control" style="width:160px" onchange="filterVehicles()">
              <option value="">All Categories</option>
              <option value="sedan">Sedan</option>
              <option value="suv">SUV</option>
              <option value="hatchback">Hatchback</option>
              <option value="auto">Auto</option>
              <option value="bike">Bike</option>
            </select>
            <select id="status-filter" class="form-control" style="width:160px" onchange="filterVehicles()">
              <option value="">All Statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="maintenance">Maintenance</option>
            </select>
            <button class="btn btn-secondary btn-sm" onclick="loadVehicles()">🔄 Refresh</button>
          </div>
        </div>

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Vehicle Details</th>
                <th>Category</th>
                <th>Driver Name</th>
                <th>Capacity / Year</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="vehicles-tbody">
              <tr><td colspan="6" style="text-align:center;padding:var(--space-6)">Loading fleet inventory...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Change Status Modal -->
<div id="status-modal" class="modal-overlay" style="display:none">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title">Change Vehicle Status</h3>
      <button class="modal-close" onclick="UI.closeModal('status-modal')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modal-vehicle-id" />
      <div class="form-group">
        <label class="form-label">Operating Status</label>
        <select id="modal-vehicle-status" class="form-control">
          <option value="active">Active (Available for rides)</option>
          <option value="inactive">Inactive (Suspended)</option>
          <option value="maintenance">Maintenance (Under repair)</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="UI.closeModal('status-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-status-btn" onclick="saveVehicleStatus()">Update Status</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  Auth.requireRole('admin', 'superadmin');
  const role = Auth.getUser()?.role || 'admin';
  buildSidebar(role, 'Vehicles');
  UI.populateSidebarUser();

  let allVehicles = [];

  async function loadVehicles() {
    const res = await API.get('/api/admin/vehicles');
    if (!res.success) {
      UI.error(res.message || 'Failed to fetch vehicles');
      return;
    }
    allVehicles = res.data || [];
    filterVehicles();
  }

  function filterVehicles() {
    const typeFilter = document.getElementById('type-filter').value;
    const statusFilter = document.getElementById('status-filter').value;

    let filtered = allVehicles;
    if (typeFilter) filtered = filtered.filter(v => v.vehicle_type === typeFilter);
    if (statusFilter) filtered = filtered.filter(v => v.status === statusFilter);

    renderTable(filtered);
  }

  function renderTable(list) {
    const tbody = document.getElementById('vehicles-tbody');
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:var(--space-6);color:var(--text-muted)">No vehicles found matching filters.</td></tr>`;
      return;
    }

    const typeIcons = {
      sedan: '🚘', suv: '🚙', hatchback: '🚗', auto: '🛺', bike: '🛵'
    };

    tbody.innerHTML = list.map(v => `
      <tr>
        <td>
          <div class="flex items-center gap-3">
            <span style="font-size:1.5rem">${typeIcons[v.vehicle_type] || '🚗'}</span>
            <div>
              <strong style="font-size:0.95rem;color:var(--text-primary)">${v.vehicle_number}</strong>
              <div style="font-size:0.8rem;color:var(--text-muted)">${v.model} ${v.color ? `(${v.color})` : ''}</div>
            </div>
          </div>
        </td>
        <td><span class="badge badge-blue" style="text-transform:uppercase">${v.vehicle_type}</span></td>
        <td>
          <strong>${v.driver_name || 'Unassigned'}</strong>
          <div style="font-size:0.75rem;color:var(--text-muted)">${v.driver_email || ''}</div>
        </td>
        <td>${v.capacity || 4} Seats · ${v.year || '—'}</td>
        <td>${UI.badge(v.status)}</td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="openStatusModal(${v.vehicle_id}, '${v.status}')">
            ⚙️ Status
          </button>
        </td>
      </tr>
    `).join('');
  }

  function openStatusModal(id, currentStatus) {
    document.getElementById('modal-vehicle-id').value = id;
    document.getElementById('modal-vehicle-status').value = currentStatus;
    UI.openModal('status-modal');
  }

  async function saveVehicleStatus() {
    const id = document.getElementById('modal-vehicle-id').value;
    const status = document.getElementById('modal-vehicle-status').value;
    const btn = document.getElementById('save-status-btn');

    UI.setLoading(btn, true, 'Updating...');
    const res = await API.put(`/api/admin/vehicles/${id}`, { status });
    UI.setLoading(btn, false, 'Update Status');

    if (res.success) {
      UI.success('Vehicle status updated!');
      UI.closeModal('status-modal');
      loadVehicles();
    } else {
      UI.error(res.message || 'Update failed');
    }
  }

  loadVehicles();
</script>
</body>
</html>
