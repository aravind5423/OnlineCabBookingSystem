<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CabGo</title>
  <meta name="description" content="Sign in to your CabGo account to book rides or manage your driver profile." />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .bg-blobs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.12;
    }
    .blob-1 { width:600px;height:600px;background:var(--primary); top:-200px;right:-200px; animation: float 8s ease-in-out infinite; }
    .blob-2 { width:400px;height:400px;background:var(--accent);  bottom:-100px;left:-100px; animation: float 10s 2s ease-in-out infinite; }

    .auth-container {
      width: 100%;
      max-width: 440px;
      padding: var(--space-4);
      position: relative;
      z-index: 1;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-10);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-lg);
      animation: fadeInUp 0.5s ease;
    }
    .auth-logo {
      display: flex; align-items: center; gap: var(--space-3);
      text-decoration: none; margin-bottom: var(--space-8);
    }
    .auth-logo-icon {
      width: 42px; height: 42px;
      background: var(--grad-accent);
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .auth-logo-text { font-family:var(--font-heading); font-size:1.3rem; font-weight:800; }
    .auth-logo-text span { color:var(--accent); }
    .auth-title    { font-size: 1.75rem; font-weight: 800; margin-bottom: var(--space-2); }
    .auth-subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: var(--space-8); }

    .form { display: flex; flex-direction: column; gap: var(--space-5); }
    .form-actions { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-2); }
    .auth-link { text-align: center; font-size: 0.875rem; color: var(--text-muted); }
    .auth-link a { color: var(--primary); font-weight: 500; }
    .auth-link a:hover { color: var(--primary-light); }

    .error-alert {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      color: var(--danger);
      font-size: 0.875rem;
      display: none;
    }
    .error-alert.show { display: block; }

    .divider {
      display: flex; align-items: center; gap: var(--space-3);
      color: var(--text-muted); font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .input-icon-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); font-size: 1rem;
      pointer-events: none;
    }
    .input-icon-wrap .form-control { padding-left: 2.75rem; }
    .eye-toggle {
      position: absolute; right: 1rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 1rem;
      transition: var(--transition);
    }
    .eye-toggle:hover { color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <a href="/" class="auth-logo">
        <div class="auth-logo-icon">🚖</div>
        <span class="auth-logo-text">Cab<span>Go</span></span>
      </a>

      <h1 class="auth-title">Welcome back 👋</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <div class="error-alert" id="error-alert"></div>

      <form class="form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-icon-wrap">
            <span class="input-icon">✉️</span>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <span class="form-error" id="email-error">Please enter a valid email</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="eye-toggle" id="eye-toggle" title="Toggle password">👁️</button>
          </div>
          <span class="form-error" id="pass-error">Password is required</span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-lg w-full" id="submit-btn">
            Sign In
          </button>
        </div>
      </form>

      <div class="divider" style="margin:var(--space-6) 0">or</div>
      <div class="auth-link">
        Don't have an account? <a href="/register.html">Create one →</a>
      </div>
      <div class="auth-link" style="margin-top:var(--space-3)">
        <a href="/">← Back to Home</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    Auth.redirectIfLoggedIn();

    const form      = document.getElementById('login-form');
    const emailEl   = document.getElementById('email');
    const passEl    = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const errAlert  = document.getElementById('error-alert');

    // Password toggle
    document.getElementById('eye-toggle').addEventListener('click', () => {
      const isPass = passEl.type === 'password';
      passEl.type = isPass ? 'text' : 'password';
    });

    function showError(msg) {
      errAlert.textContent = msg;
      errAlert.classList.add('show');
    }
    function hideError() { errAlert.classList.remove('show'); }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      hideError();

      const email    = emailEl.value.trim();
      const password = passEl.value;

      if (!email)    { document.getElementById('email-error').classList.add('show'); return; }
      if (!password) { document.getElementById('pass-error').classList.add('show');  return; }

      // Clear inline errors
      document.querySelectorAll('.form-error').forEach(el => el.classList.remove('show'));

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Signing in...';

      const result = await API.post('/api/auth/login', { email, password });

      if (result.success) {
        Auth.setSession(result.data.token, result.data.user);
        Auth.redirectToDashboard(result.data.user.role);
      } else {
        showError(result.message || 'Login failed. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
