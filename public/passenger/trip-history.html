<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip History — CabGo</title>
  <link rel="stylesheet" href="/css/global.css" /><link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="app-layout">
  <div class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div><h1>📋 Trip History</h1><p>All your past and current rides</p></div>
      </div>

      <!-- Filters -->
      <div class="card" style="margin-bottom:var(--space-6)">
        <div style="display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:flex-end">
          <div class="form-group" style="flex:1;min-width:200px">
            <label class="form-label">Filter by Status</label>
            <select class="form-control" id="filter-status">
              <option value="">All Trips</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
              <option value="started">Started</option>
              <option value="pending">Pending</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="loadTrips()">Apply Filter</button>
        </div>
      </div>

      <div class="table-wrapper">
        <div class="table-header">
          <h3 style="font-size:1rem;font-weight:600">Your Trips</h3>
          <div class="table-search">
            <span class="table-search-icon">🔍</span>
            <input type="text" placeholder="Search trips..." id="trip-search" oninput="filterTable()" />
          </div>
        </div>
        <div id="trips-table">
          <div class="empty-state"><div class="spinner spinner-lg"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Rate Trip Modal -->
<div class="modal-overlay hidden" id="rate-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">⭐ Rate Your Trip</h3>
      <button class="modal-close" onclick="UI.closeModal('rate-modal')">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:var(--space-5)">
      <p style="color:var(--text-muted)">How was your experience?</p>
      <div>
        <label class="form-label">Rating</label>
        <div class="star-rating" id="star-input" style="font-size:2rem;gap:8px;margin-top:8px">
          ${[1,2,3,4,5].map(i=>`<span class="star" data-v="${i}" onclick="selectStar(${i})">★</span>`).join('')}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Comment (optional)</label>
        <textarea id="rating-comment" class="form-control" rows="3" placeholder="Share your experience..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="UI.closeModal('rate-modal')">Skip</button>
      <button class="btn btn-primary" id="submit-rating-btn" onclick="submitRating()">Submit Rating</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script><script src="/js/auth.js"></script>
<script src="/js/ui.js"></script><script src="/js/sidebar.js"></script>
<script>
  Auth.requireRole('passenger');
  buildSidebar('passenger','Trip History');
  UI.populateSidebarUser();

  let allTrips = [], currentTripId = null, selectedRating = 0;

  async function loadTrips() {
    const result = await API.get('/api/rides/history');
    allTrips = result.data || [];
    const status = document.getElementById('filter-status').value;
    const filtered = status ? allTrips.filter(t => (t.trip_status||t.request_status) === status) : allTrips;
    renderTable(filtered);
  }

  function renderTable(trips) {
    if (!trips.length) {
      document.getElementById('trips-table').innerHTML = UI.empty('🚖','No trips found','Your trips will appear here.');
      return;
    }
    document.getElementById('trips-table').innerHTML = `
      <table><thead><tr>
        <th>#</th><th>Route</th><th>Driver</th><th>Vehicle</th>
        <th>Date</th><th>Distance</th><th>Fare</th><th>Status</th><th>Action</th>
      </tr></thead><tbody>
      ${trips.map(t => `<tr>
        <td><strong>#${t.trip_id||t.request_id}</strong></td>
        <td>
          <div style="font-size:0.85rem"><strong>${(t.pickup_location||'').substring(0,25)}</strong></div>
          <div style="font-size:0.75rem;color:var(--text-muted)">→ ${(t.destination||'').substring(0,25)}</div>
        </td>
        <td>${t.driver_name
          ? `<strong>${t.driver_name}</strong><br><small>${UI.stars(t.driver_rating||5)}</small>`
          : '<span style="color:var(--text-muted)">—</span>'}</td>
        <td>${t.vehicle_number||'—'}<br><small style="color:var(--text-muted)">${t.model||''}</small></td>
        <td style="font-size:0.8rem">${UI.formatDate(t.start_time||t.requested_at)}</td>
        <td>${t.distance_km ? t.distance_km+'km' : '—'}</td>
        <td><strong>${UI.rupee(t.fare||t.estimated_fare)}</strong></td>
        <td>${UI.badge(t.trip_status||t.request_status)}</td>
        <td>
          ${(t.trip_status==='completed'&&!t.my_rating)
            ? `<button class="btn btn-accent btn-sm" onclick="openRateModal(${t.trip_id})">⭐ Rate</button>`
            : t.my_rating ? `<span>${UI.stars(t.my_rating)}</span>` : '—'}
        </td>
      </tr>`).join('')}
      </tbody></table>`;
  }

  function filterTable() {
    const q = document.getElementById('trip-search').value.toLowerCase();
    const filtered = allTrips.filter(t =>
      (t.pickup_location||'').toLowerCase().includes(q) ||
      (t.destination||'').toLowerCase().includes(q) ||
      (t.driver_name||'').toLowerCase().includes(q));
    renderTable(filtered);
  }

  function openRateModal(tripId) {
    currentTripId = tripId; selectedRating = 0;
    document.querySelectorAll('#star-input .star').forEach(s => s.classList.remove('filled'));
    document.getElementById('rating-comment').value = '';
    UI.openModal('rate-modal');
  }

  function selectStar(val) {
    selectedRating = val;
    document.querySelectorAll('#star-input .star').forEach(s => {
      s.classList.toggle('filled', +s.dataset.v <= val);
    });
  }

  async function submitRating() {
    if (!selectedRating) return UI.warning('Please select a rating');
    const btn = document.getElementById('submit-rating-btn');
    UI.setLoading(btn, true, 'Submitting...');
    const res = await API.post(`/api/rides/${currentTripId}/rate`, {
      rating: selectedRating,
      comment: document.getElementById('rating-comment').value
    });
    UI.setLoading(btn, false, 'Submit Rating');
    if (res.success) {
      UI.success('Rating submitted! Thank you.');
      UI.closeModal('rate-modal');
      loadTrips();
    } else UI.error(res.message);
  }

  loadTrips();
</script>
</body>
</html>
